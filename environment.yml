name: era5-pollution-risk
channels:
  - conda-forge
  - defaults

dependencies:
  # ============================================================================
  # Core Python
  # ============================================================================
  - python=3.10

  # ============================================================================
  # Scientific + Numerical Stack (IR₃ → IR₅)
  # ============================================================================
  - numpy
  - pandas
  - xarray
  - netcdf4
  - scipy
  - bottleneck
  - numba
  - toolz
  - cftime # REQUIRED for Stage 05 temporal windows (IR₅)
  - pytz # REQUIRED for timezone‑safe IR₁ → IR₄ transitions

  # ============================================================================
  # ERA5 + GRIB Decoding (IR₀ → IR₁)
  # ============================================================================
  - cdsapi
  - eccodes=2.33.0
  - cfgrib=0.9.10.4

  # ============================================================================
  # Geospatial Stack (IR₄)
  # ============================================================================
  - cartopy=0.22.0
  - shapely=2.0.1
  - pyproj=3.6.0

  # ============================================================================
  # Visualization (Diagnostics for IR₃ → IR₅)
  # ============================================================================
  - matplotlib
  - seaborn

  # ============================================================================
  # Utilities (All Stages)
  # ============================================================================
  - pyyaml
  - tqdm
  - requests
  - rich

  # ============================================================================
  # Jupyter (Development)
  # ============================================================================
  - jupyterlab
  - ipykernel

  # ============================================================================
  # Parallel + Chunking (IR₂ → IR₃)
  # ============================================================================
  - dask
  - dask-core

  # ============================================================================
  # Parquet + Cloud Storage (IR₁ → IR₂)
  # ============================================================================
  - fastparquet
  - zarr
  - fsspec

  # ============================================================================
  # Testing (All Stages)
  # ============================================================================
  - pytest
  - pytest-cov

  # ============================================================================
  # pip-only packages
  # ============================================================================
  - pip:
      - aiohttp
      - python-dotenv
      - pyarrow==17.0.0
