name: era5-pollution-risk
channels:
  - conda-forge
  - defaults

dependencies:
  # ----------------------------------------------------------------------------
  # Core Python version
  # ----------------------------------------------------------------------------
  - python=3.10

  # ----------------------------------------------------------------------------
  # Core scientific stack
  # ----------------------------------------------------------------------------
  - numpy
  - pandas
  - xarray
  - netcdf4
  - scipy

  # ----------------------------------------------------------------------------
  # ERA5 + climate data tools
  # ----------------------------------------------------------------------------
  - cdsapi
  - eccodes
  - cfgrib

  # ----------------------------------------------------------------------------
  # Geospatial stack
  # ----------------------------------------------------------------------------
  - cartopy
  - shapely
  - pyproj

  # ----------------------------------------------------------------------------
  # Visualization stack
  # ----------------------------------------------------------------------------
  - matplotlib
  - seaborn

  # ----------------------------------------------------------------------------
  # Utility packages
  # ----------------------------------------------------------------------------
  - pyyaml
  - tqdm
  - requests
  - rich

  # ----------------------------------------------------------------------------
  # Jupyter support
  # ----------------------------------------------------------------------------
  - jupyterlab

  # ----------------------------------------------------------------------------
  # pip-only packages
  # ----------------------------------------------------------------------------
  - pip:
      - aiohttp
      - python-dotenv
      - pyarrow
