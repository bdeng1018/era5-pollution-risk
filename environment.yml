name: era5-pollution-risk
channels:
  - conda-forge
  - defaults

dependencies:
  # ============================================================================
  # Core Python version
  # ============================================================================
  - python=3.10

  # ============================================================================
  # Core scientific stack
  # ============================================================================
  - numpy
  - pandas
  - xarray
  - netcdf4
  - scipy

  # ============================================================================
  # ERA5 + climate data tools
  # ============================================================================
  - cdsapi
  - eccodes
  - cfgrib

  # ============================================================================
  # Geospatial + mapping stack
  # ============================================================================
  - cartopy
  - shapely
  - pyproj

  # ============================================================================
  # Visualization stack
  # ============================================================================
  - matplotlib
  - seaborn

  # ============================================================================
  # Utility packages
  # ============================================================================
  - pyyaml
  - tqdm
  - requests
  - rich

  # ============================================================================
  # Jupyter support
  # ============================================================================
  - jupyterlab

  # ============================================================================
  # Development tools (Branch 1 ergonomics)
  # ============================================================================
  - pytest
  - black
  - isort
  - flake8

  # ============================================================================
  # Required for pip installs
  # ============================================================================
  - pip
  - setuptools
  - wheel

  # ============================================================================
  # pip-only packages
  # ============================================================================
  - pip:
      - aiohttp
      - python-dotenv
      - pyarrow
