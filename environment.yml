name: era5-pollution-risk
channels:
  - conda-forge
  - defaults

dependencies:
  # ============================================================================
  # Core Python
  # ============================================================================
  - python=3.10

  # ============================================================================
  # Scientific + Numerical Stack
  # ============================================================================
  - numpy
  - pandas
  - xarray
  - netcdf4
  - scipy
  - bottleneck
  - numba
  - toolz

  # ============================================================================
  # ERA5 + GRIB Decoding
  # ============================================================================
  - cdsapi
  - eccodes=2.33.0
  - cfgrib=0.9.10.4

  # ============================================================================
  # Geospatial Stack
  # ============================================================================
  - cartopy=0.22.0
  - shapely=2.0.1
  - pyproj=3.6.0

  # ============================================================================
  # Visualization
  # ============================================================================
  - matplotlib
  - seaborn

  # ============================================================================
  # Utilities
  # ============================================================================
  - pyyaml
  - tqdm
  - requests
  - rich

  # ============================================================================
  # Jupyter
  # ============================================================================
  - jupyterlab
  - ipykernel

  # ============================================================================
  # Parallel + Chunking (Stage 3)
  # ============================================================================
  - dask
  - dask-core
  # - dask[dataframe]
  # - dask[array]

  # ============================================================================
  # Parquet + Cloud Storage
  # ============================================================================
  - fastparquet
  - zarr
  - fsspec

  # ============================================================================
  # Testing
  # ============================================================================
  - pytest
  - pytest-cov

  # ============================================================================
  # pip-only packages
  # ============================================================================
  - pip:
      - aiohttp
      - python-dotenv
      - pyarrow==17.0.0
      # - pydantic
      # - black
      # - ruff
      # - pre-commit
      # - pytest-xdist
