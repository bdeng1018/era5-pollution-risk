[pytest]

# ==============================================================================
# Ensure pytest can import modules from the project root.
# This allows tests to use imports like:
#     from src.preprocessing_02.convert_grib_to_parquet import ...
# ==============================================================================
pythonpath = .

# ==============================================================================
# Display shorter tracebacks for readability.
# (End‑users can switch to "long" if debugging deeply.)
# ==============================================================================
addopts = -ra --tb=short

# ==============================================================================
# Test discovery rules
# ==============================================================================
# Pytest will automatically discover tests in:
#     tests/
# and any file matching:
#     test_*.py
#     *_test.py
# ==============================================================================
testpaths =
    tests

# ==============================================================================
# Markers (optional for future Branch 2 expansion)
# ==============================================================================
# You can define custom markers here, e.g.:
#     slow: long‑running tests
#     integration: multi‑stage pipeline tests
# ==============================================================================
markers =
    slow: marks tests as slow (not run by default)
    integration: marks integration tests for multi‑stage pipeline validation
