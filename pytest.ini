[pytest]

# ==============================================================================
# Import path configuration
# ==============================================================================
# Ensure pytest imports modules from the project root (src/ included).
# This prevents namespace shadowing and keeps Stage 1 monkeypatching stable.
# ------------------------------------------------------------------------------
pythonpath = .

# ==============================================================================
# Prevent pytest from treating non-source directories as import roots.
# These directories contain runtime artifacts and must never be imported.
# ==============================================================================
norecursedirs =
    data
    logs
    metadata
    raw
    intermediate
    features
    predictions
    model_artifacts

# ==============================================================================
# Pytest options
# ==============================================================================
# -ra: show extra test summary info
# --tb=short: concise tracebacks for faster debugging
# log_cli: real-time logging (critical for Stage 1 retry tests)
# ------------------------------------------------------------------------------
addopts = -ra --tb=short

log_cli = true
log_cli_level = INFO

# ==============================================================================
# Warning filters
# ==============================================================================
# Silence noisy pandas / numpy / deprecation warnings during preprocessing tests.
# ------------------------------------------------------------------------------
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning

# ==============================================================================
# Asyncio mode (future-proofing)
# ==============================================================================
# If any Stage 3 or Stage 4 components become async, pytest will handle them.
# ------------------------------------------------------------------------------
asyncio_mode = auto

# ==============================================================================
# Test discovery rules
# ==============================================================================
# Only discover tests inside the tests/ directory.
# Prevents accidental discovery inside src/ or configs/.
# ------------------------------------------------------------------------------
testpaths = tests

# ==============================================================================
# Custom markers
# ==============================================================================
# slow: long-running tests (e.g., full preprocessing or chunking)
# integration: multi-stage pipeline validation
# ------------------------------------------------------------------------------
markers =
    slow: marks tests as slow (not run by default)
    integration: marks integration tests for multi-stage pipeline validation
