# ==============================================================================
# Branch 2 Configuration
# Modular configuration for ERA5 ingestion, preprocessing, and pipeline structure.
# ==============================================================================

era5:
  # ERA5 ingestion configuration (single-variable + monthly)
  variables: configs/variables.yml
  years: configs/years.yml
  months: configs/months.yml
  region: configs/region.yml

paths:
  # Directory structure for raw data, metadata, intermediate files, logs, etc.
  config: configs/paths.yml

metadata:
  # Metadata schema for Branch 2 ingestion
  enabled: true
  format: json

environment:
  # Environment validation requirements (Branch 2)
  require_cdsapi_credentials: true
  require_cfgrib: false
  require_eccodes: false

model:
  # Model configuration (not used in Branch 2 ingestion, kept for pipeline completeness)
  target: t2m
  artifact_dir: models
  features_dir: data/features
  predictions_dir: data/predictions
