# ==============================================================================
# Branch 2 Configuration
# Modular configuration for ERA5 ingestion, preprocessing, and pipeline structure.
# ==============================================================================

era5:
  variables: configs/variables.yml
  years: configs/years.yml
  months: configs/months.yml
  region: configs/region.yml

paths:
  raw_dir: data/raw/era5
  metadata_dir: data/metadata
  intermediate_dir: data/intermediate
  logs_dir: data/logs
  features_dir: data/features
  model_artifact_dir: models
  predictions_dir: data/predictions
  config_dir: configs

  chunk_output_dir: data/chunks
  chunk_metadata_dir: data/chunks_metadata

metadata:
  enabled: true
  format: json

environment:
  require_cdsapi_credentials: true
  require_cfgrib: false
  require_eccodes: false

model:
  target: t2m
  artifact_dir: models
  features_dir: data/features
  predictions_dir: data/predictions

# ------------------------------------------------------------------------------
# Stage 3 — Chunked Core Processing (required)
# ------------------------------------------------------------------------------

stage3:
  variables:
    - t2m
    - d2m
    - u10
    - v10
    - msl
    - sp
    - tp
    - slhf
    - ssr
    - str
    - sshf
    - ssrc
    - ssrd
    - tcc
    - e
    - blh
    - cape
    - cin
    - lsm
    - tco3
    - tcwv

  chunk:
    size:
      time: 168 # 7 days × 24 hours
    stride:
      time: 168 # non-overlapping chunks

  output:
    chunk_output_dir: data/chunks
    chunk_metadata_dir: data/chunks_metadata
