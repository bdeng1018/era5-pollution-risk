# ==============================================================================
# ERA5 Pollution‑Risk Pipeline — Branch 2 (IR₀ → IR₅)
# ==============================================================================
# Stages:
#   Stage 1 — IR₀ Raw GRIB ingestion
#   Stage 2 — IR₁ Hourly parquet + metadata.json
#   Stage 3 — IR₂ Chunked tiles + IR₃ merged.nc
#   Stage 4 — IR₄ Spatiotemporal tensor
#   Stage 5 — IR₅ Feature tensors (completed)
# ==============================================================================

# ==============================================================================
# Environment
# ==============================================================================

environment:
  require_cdsapi_credentials: true
  require_cfgrib: false
  require_eccodes: false
  hashing: sha256

# ==============================================================================
# PATHS (IR‑aligned)
# ==============================================================================

paths:
  raw_dir: data/raw/era5 # IR₀
  intermediate_dir: data/intermediate # IR₁ + IR₃
  metadata_dir: data/metadata # IR₁ metadata

  chunk_output_dir: data/chunks # IR₂
  stage3_output:
    chunk_metadata_dir: data/chunks_metadata # IR₂ metadata

  stage3_merged: data/intermediate/merged.nc
  stage3_metadata: data/intermediate/merged_metadata.json
  stage3_qc: data/intermediate/merged_qc.json

  stage4_output_dir: data/spatiotemporal # IR₄
  stage4_dataset: data/spatiotemporal/stage4_tensor.nc
  stage4_qc: data/spatiotemporal/stage4_qc.pkl
  stage4_metadata: data/spatiotemporal/stage4_metadata.pkl

  features_dir: data/features # IR₅
  features_tensor: data/features/ir5_features.zarr
  features_metadata: data/features/metadata.json
  features_qc: data/features/ir5_qc.json
  features_registry: data/features/registry.json

# ==============================================================================
# STAGE 1 — IR₀ Raw GRIB Ingestion
# ==============================================================================

stage1:
  # ERA5 variables to download
  variables:
    - "10m_u_component_of_wind"
    - "10m_v_component_of_wind"
    - "2m_dewpoint_temperature"
    - "2m_temperature"
    - "mean_sea_level_pressure"
    - "surface_pressure"
    - "total_precipitation"
    - "surface_latent_heat_flux"
    - "surface_net_solar_radiation"
    - "surface_net_thermal_radiation"
    - "surface_sensible_heat_flux"
    - "surface_solar_radiation_downward_clear_sky"
    - "surface_solar_radiation_downwards"
    - "total_cloud_cover"
    - "evaporation"
    - "boundary_layer_height"
    - "convective_available_potential_energy"
    - "convective_inhibition"
    - "land_sea_mask"
    - "total_column_ozone"
    - "total_column_water_vapour"

  # Years and months to ingest
  years: ["2019", "2020", "2021", "2022", "2023", "2024"]
  months:
    ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"]

  # GRIB → Parquet conversion settings
  convert:
    drop_grib_metadata: true
    normalize_coordinates: true
    write_hourly_parquet: true

# ==============================================================================
# STAGE 2 — IR₁ Hourly Parquet + metadata.json
# ==============================================================================

stage2:
  # Output directory for variable‑split parquet
  output_dir: data/intermediate

  # Metadata.json settings
  metadata:
    write_flat_keys: true # "<timestamp>::<variable>"
    include_paths: true
    include_dtypes: true
    include_shape: true

# ==============================================================================
# STAGE 3 — IR₂ Chunk Engine + IR₃ merged.nc
# ==============================================================================

stage3:
  # Variables to process (single‑variable chunks)
  variables:
    - t2m
    - d2m
    - u10
    - v10
    - msl
    - sp
    - tcc
    - blh
    - cape
    - cin
    - tco3
    - tcwv

    # Flux/static (commented out)
    # - tp
    # - slhf
    # - ssr
    # - str
    # - sshf
    # - ssrdc
    # - ssrd
    # - e
    # - lsm

  # Chunk windowing (12‑hour windows, 6‑hour stride)
  chunk:
    size:
      time: 12
    stride:
      time: 6

  # Orchestrator settings
  orchestrator:
    max_workers: 6
    max_retries: 2

  output:
    chunk_metadata_dir: data/chunks_metadata

# ==============================================================================
# SCHEMA — IR₂ Single‑Variable Chunk Schema
# ==============================================================================
# IMPORTANT:
#   Stage‑3 dynamically injects the variable column into schema.columns.
#   This config only defines coordinate columns + default dtypes.
#
#   Final schema per variable:
#       columns: ["time", "lat", "lon", <variable>]
#       dtypes:
#         time: datetime64[ns]
#         lat: float64
#         lon: float64
#         <variable>: float64
# ==============================================================================

schema:
  columns:
    - time
    - lat
    - lon

  dtypes:
    time: datetime64[ns]
    lat: float64
    lon: float64

  version: "2.2-ir-boundary"

# ==============================================================================
# STAGE 4 — IR₄ Spatiotemporal Tensor
# ==============================================================================

stage4:
  enabled: true
  input_path: data/intermediate/merged.nc
  output_dir: data/spatiotemporal

  # Tensor construction parameters
  tensor:
    lat_resolution: 0.25
    lon_resolution: 0.25
    time_resolution_hours: 12

  # Pollution‑risk feature engineering
  fields:
    - t2m
    - d2m
    - u10
    - v10
    - msl
    - sp
    - tcc
    - blh
    - cape
    - cin
    - tco3
    - tcwv

  # Flux/static (commented out)
  # - tp
  # - slhf
  # - ssr
  # - str
  # - sshf
  # - ssrdc
  # - ssrd
  # - e
  # - lsm

# ==============================================================================
# STAGE 5 — IR₅ Feature Engineering (Completed)
# ==============================================================================

stage5:
  enabled: true

  input_tensor: data/spatiotemporal/stage4_tensor.nc
  output_tensor: data/features/stage5_features.nc
  metadata_path: data/features/stage5_metadata.json
  qc_path: data/features/stage5_qc.json
  registry_path: data/features/registry.json
  hashing: sha256

  temporal_features:
    - t2m_roll_mean_6h
    - t2m_roll_mean_24h
    - t2m_delta_24h
    - d2m_roll_mean_6h
    - d2m_roll_mean_24h
    - d2m_delta_24h
    - u10_roll_mean_6h
    - u10_roll_mean_24h
    - u10_delta_24h
    - v10_roll_mean_6h
    - v10_roll_mean_24h
    - v10_delta_24h
    - msl_roll_mean_6h
    - msl_roll_mean_24h
    - msl_delta_24h

  spatial_features:
    - t2m_mean_3x3
    - t2m_laplacian
    - d2m_mean_3x3
    - d2m_laplacian
    - u10_mean_3x3
    - u10_laplacian
    - v10_mean_3x3
    - v10_laplacian
    - msl_mean_3x3
    - msl_laplacian

  composite_features:
    - instability_index
    - moisture_temp_index
    - pressure_context_index
    - wind_shear_index

# ==============================================================================
# STAGE 6 — Modeling (Planned)
# ==============================================================================

stage6:
  enabled: false
  target: t2m
  artifact_dir: models
  predictions_dir: data/predictions
