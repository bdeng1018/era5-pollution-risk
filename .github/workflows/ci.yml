name: ERA5 Branch 1 CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

jobs:
    era5-ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python 3.10
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Create virtual environment
              run: |
                  python3 -m venv .venv
                  .venv/bin/pip install --upgrade pip
                  .venv/bin/pip install ruff pytest cdsapi rich pyyaml pandas xarray

            - name: Run Ruff linting
              run: |
                  .venv/bin/ruff check src tests

            - name: Run pytest (Branch 1 smoke tests)
              run: |
                  .venv/bin/pytest -q

            - name: Build Docker image (optional)
              run: |
                  docker build -t era5-branch1 -f deployment/Dockerfile .

            - name: Validate Makefile pipeline (smoke test)
              run: |
                  make env
