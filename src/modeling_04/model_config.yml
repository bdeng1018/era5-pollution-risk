# ------------------------------------------------------------------------------
# Model configuration (Branch 1)
# Minimal settings for a baseline model used to keep the pipeline runnable.
# Branch 2 will introduce full model registry, hyperparameters, metadata,
# experiment tracking, and multiple model families.
# ------------------------------------------------------------------------------

model:
  name: baseline_mean_model
  type: mean_predictor     # Branch 1 placeholder model
  target: target_variable  # Replace with actual target in Branch 2

paths:
  features: data/features/features.parquet
  model_artifact: models/model.pkl

training:
  train_fraction: 1.0      # Branch 1 uses all data (no split yet)
  shuffle: false           # No shuffling needed for baseline model

metadata:
  branch: 1
  description: "Minimal baseline model configuration for ERA5 pollution-risk pipeline."